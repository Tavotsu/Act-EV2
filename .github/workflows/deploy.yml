name: CI/CD Pipeline AWS ECR y SSM (3 Tiers)

on:
  push:
    branches:
      - deploy

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR (runner)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build y Push Frontend
        run: |
          cd front_despacho
          docker build -t frontend-despachos .
          docker tag frontend-despachos:latest ${{ steps.login-ecr.outputs.registry }}/frontend-despachos:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/frontend-despachos:latest

      - name: Build y Push Backend Ventas
        run: |
          cd back-Ventas_SpringBoot
          docker build -t backend-ventas .
          docker tag backend-ventas:latest ${{ steps.login-ecr.outputs.registry }}/backend-ventas:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/backend-ventas:latest

      - name: Build y Push Backend Despachos
        run: |
          cd back-Despachos_SpringBoot
          docker build -t backend-despachos .
          docker tag backend-despachos:latest ${{ steps.login-ecr.outputs.registry }}/backend-despachos:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/backend-despachos:latest

  deploy-database:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Desplegar MySQL en EC2 Data
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_DATA_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Desplegar Database MySQL" \
            --parameters '{"commands":[
              "set -e",
              "docker stop mysql_db || true",
              "docker rm mysql_db || true",
              "docker run -d --name mysql_db --restart always -p 3306:3306 -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }} -v db_data:/var/lib/mysql mysql:8.0"
            ]}'

  deploy-backends:
    needs: deploy-database
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Obtener ECR URI
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Desplegar Backends en EC2 App
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_APP_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Desplegar Backends" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/backend-ventas:latest",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/backend-despachos:latest",
              "docker stop backend_ventas || true",
              "docker rm backend_ventas || true",
              "docker stop backend_despachos || true",
              "docker rm backend_despachos || true",
              "docker run -d --name backend_ventas --restart always -p 80:8080 -e DB_ENDPOINT=${{ secrets.DATA_PRIVATE_IP }} -e DB_PORT=3306 -e DB_NAME=ventas -e DB_USERNAME=root -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ steps.login-ecr.outputs.registry }}/backend-ventas:latest",
              "docker run -d --name backend_despachos --restart always -p 3001:8081 -e DB_ENDPOINT=${{ secrets.DATA_PRIVATE_IP }} -e DB_PORT=3306 -e DB_NAME=despachos -e DB_USERNAME=root -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ steps.login-ecr.outputs.registry }}/backend-despachos:latest"
            ]}'

  deploy-frontend:
    needs: deploy-backends
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Obtener ECR URI
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Desplegar Frontend en EC2 Web
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_WEB_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Desplegar Frontend" \
            --parameters '{"commands":[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/frontend-despachos:latest",
              "docker stop frontend_app || true",
              "docker rm frontend_app || true",
              "docker run -d --name frontend_app --restart always -p 80:8080 -e BACKEND_IP=${{ secrets.APP_PRIVATE_IP }} ${{ steps.login-ecr.outputs.registry }}/frontend-despachos:latest"
            ]}'
