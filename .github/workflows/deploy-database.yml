name: CI/CD DB (MySQL)

on:
  workflow_dispatch:
  push:
    branches:
      - deploy

jobs:
  deploy-database:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Desplegar MySQL en EC2 Data
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Desplegar Database MySQL" \
            --parameters '{"commands":[
              "set -e",
              "docker stop mysql_db || true",
              "docker rm mysql_db || true",
              "docker run -d --name mysql_db --restart always -p 3306:3306 -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }} -v db_data:/var/lib/mysql mysql:8.0"
            ]}'
